<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Peta Titik SE2026</title>
<link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="/style.css">
</head>
<body>
  <nav id="topnav">
    <span id="brand">Titik SE2026</span>
    <button id="nav-peta" class="nav-btn active">Peta</button>
    <button id="nav-daftar" class="nav-btn">Daftar</button>
  </nav>

  <section id="view-peta" class="view active">
    <div id="map"></div>

    <div id="panel">
      <div id="panel-header">
        <h1>Peta Titik SE2026</h1>
        <button id="panel-toggle" type="button" aria-expanded="true" aria-controls="panel-body" title="Sembunyikan filter">
          <span aria-hidden="true">&#9650;</span>
        </button>
      </div>
      <div id="panel-body">
        <div class="filter-row">
          <label for="kabkota-select">Kabupaten/Kota:</label>
          <select id="kabkota-select">
            <option value="">Semua Kabupaten/Kota</option>
          </select>
        </div>
        <div class="filter-row">
          <label for="kecamatan-select">Kecamatan:</label>
          <select id="kecamatan-select" disabled>
            <option value="">Semua Kecamatan</option>
          </select>
        </div>
        <div class="filter-row">
          <label for="desa-select">Desa/Kelurahan:</label>
          <select id="desa-select" disabled>
            <option value="">Semua Desa/Kelurahan</option>
          </select>
        </div>
        <div class="filter-row">
          <label for="sls-select">Kode SLS:</label>
          <select id="sls-select" disabled>
            <option value="">Semua SLS</option>
          </select>
        </div>
        <div class="filter-row">
          <label for="subsls-select">Kode SubSLS:</label>
          <select id="subsls-select" disabled>
            <option value="">Semua SubSLS</option>
          </select>
        </div>
        <div class="filter-row" id="apply-filter-row">
          <button id="apply-filter-btn" class="apply-filter-btn" type="button">Terapkan Filter</button>
        </div>
        <div id="stats">Memuat statistik…</div>
        <div id="legend">
          <div class="legend-row"><span class="dot dot-point"></span> Titik individual</div>
          <div class="legend-row"><span class="dot dot-cluster"></span> Kelompok (angka = jumlah titik)</div>
        </div>
      </div>
    </div>

    <div id="loading" class="hidden">Memuat data…</div>
  </section>

  <section id="view-daftar" class="view">
    <div id="daftar-container">
      <div id="daftar-head">
        <h1>Daftar Titik SE2026</h1>
        <button id="daftar-filter-toggle" type="button" aria-expanded="true" aria-controls="daftar-filters">
          Filter <span aria-hidden="true">&#9650;</span>
        </button>
      </div>

      <div id="daftar-filters">
        <div class="filter-row">
          <label for="daftar-search">Cari Nama:</label>
          <input type="text" id="daftar-search" placeholder="Cari nama responden…" autocomplete="off">
        </div>
        <div class="filter-row">
          <label for="kabkota-select-list">Kabupaten/Kota:</label>
          <select id="kabkota-select-list">
            <option value="">Semua Kabupaten/Kota</option>
          </select>
        </div>
        <div class="filter-row">
          <label for="kecamatan-select-list">Kecamatan:</label>
          <select id="kecamatan-select-list" disabled>
            <option value="">Semua Kecamatan</option>
          </select>
        </div>
        <div class="filter-row">
          <label for="desa-select-list">Desa/Kelurahan:</label>
          <select id="desa-select-list" disabled>
            <option value="">Semua Desa/Kelurahan</option>
          </select>
        </div>
        <div class="filter-row">
          <label for="sls-select-list">Kode SLS:</label>
          <select id="sls-select-list" disabled>
            <option value="">Semua SLS</option>
          </select>
        </div>
        <div class="filter-row">
          <label for="subsls-select-list">Kode SubSLS:</label>
          <select id="subsls-select-list" disabled>
            <option value="">Semua SubSLS</option>
          </select>
        </div>
        <div class="filter-row">
          <label for="jenisprelist-select-list">Jenis Prelist:</label>
          <select id="jenisprelist-select-list">
            <option value="">Semua Jenis Prelist</option>
          </select>
        </div>
        <div class="filter-row">
          <label for="keberadaankeluarga-select-list">Keberadaan Keluarga:</label>
          <select id="keberadaankeluarga-select-list">
            <option value="">Semua Keberadaan Keluarga</option>
          </select>
        </div>
        <div class="filter-row">
          <label for="status-select-list">Status:</label>
          <select id="status-select-list">
            <option value="">Semua Status</option>
          </select>
        </div>
        <div id="daftar-actions">
          <button id="apply-filter-btn-list" class="apply-filter-btn" type="button">Terapkan Filter</button>
          <div id="download-btn-group">
            <button id="download-pdf-btn" disabled title="Pilih filter minimal sampai Desa/Kelurahan untuk mengunduh">
              Unduh PDF
            </button>
            <button id="download-xlsx-btn" disabled title="Pilih filter minimal sampai Desa/Kelurahan untuk mengunduh">
              Unduh Excel
            </button>
          </div>
        </div>
      </div>

      <div id="daftar-toolbar">
        <span id="daftar-page-info">Memuat…</span>
        <div id="daftar-pagination">
          <button id="daftar-prev">&laquo; Sebelumnya</button>
          <button id="daftar-next">Selanjutnya &raquo;</button>
          <label for="daftar-pagesize">Baris/halaman:</label>
          <select id="daftar-pagesize">
            <option value="25">25</option>
            <option value="50" selected>50</option>
            <option value="100">100</option>
            <option value="200">200</option>
          </select>
        </div>
      </div>

      <div id="daftar-error" class="hidden"></div>

      <div id="daftar-table-wrap">
        <table id="daftar-table">
          <thead>
            <tr>
              <th class="num">No</th>
              <th class="sortable" data-sort="nama">Nama<span class="sort-arrow"></span></th>
              <th class="sortable" data-sort="alamat">Alamat<span class="sort-arrow"></span></th>
              <th class="sortable" data-sort="subsls">ID SUBSLS<span class="sort-arrow"></span></th>
              <th class="sortable" data-sort="jenis_prelist">Jenis Prelist<span class="sort-arrow"></span></th>
              <th class="sortable num" data-sort="nomor_bangunan">Nomor Bangunan<span class="sort-arrow"></span></th>
              <th class="sortable" data-sort="keberadaan_keluarga">Keberadaan Keluarga<span class="sort-arrow"></span></th>
              <th class="sortable" data-sort="status">Status<span class="sort-arrow"></span></th>
              <th class="sortable" data-sort="assignment_id">Assignment ID<span class="sort-arrow"></span></th>
            </tr>
          </thead>
          <tbody id="daftar-tbody"></tbody>
        </table>
      </div>
    </div>

    <div id="daftar-loading" class="hidden">Memuat data…</div>
  </section>

  <script src="/vendor/leaflet/leaflet.js"></script>
  <script src="/common.js"></script>
  <script src="/app.js"></script>
  <script src="/daftar.js"></script>
  <script src="/nav.js"></script>
</body>
</html>
