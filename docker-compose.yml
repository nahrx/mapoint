services:
  app:
    image: se2026-titik-maps:latest
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      - HOST=${HOST}
      - PORT=${PORT}         # Used for ClickHouse (9000)
      - DATABASE=${DATABASE}
      - USERNAME=${USERNAME}
      - PASSWORD=${PASSWORD}
      - HTTP_PORT=8082       # Or APP_PORT / LISTEN_ADDR=:8082 depending on app code
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8082/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
