services:
  app:
    build: .
    image: mapoint:latest
    restart: unless-stopped
    ports:
      - "8082:8080" # Maps host port 8082 to container port 8080
    environment:
      - HOST=${HOST}
      - PORT=${PORT}
      - DATABASE=${DATABASE}
      - USERNAME=${USERNAME}
      - PASSWORD=${PASSWORD}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
