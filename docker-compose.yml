services:
  app:
    build: .
    image: mapoint:latest
    restart: unless-stopped
    ports:
      - "8082:8080" # Maps host port 8082 to container port 8080
    environment:
      - HOST=${HOST}
      - PORT=${PORT}
      - DATABASE=${DATABASE}
      - USERNAME=${USERNAME}
      - PASSWORD=${PASSWORD}
      # Optional PostGIS connection for the SubSLS boundary polygon layer
      # on the Peta map — leave MAP_HOST unset/empty to run without it.
      - MAP_HOST=${MAP_HOST}
      - MAP_PORT=${MAP_PORT}
      - MAP_DATABASE=${MAP_DATABASE}
      - MAP_USERNAME=${MAP_USERNAME}
      - MAP_PASSWORD=${MAP_PASSWORD}
      # Keterangan "data terakhir diperbarui" di atas filter menu Daftar.
      # Opsional — kosong berarti barisnya tidak ditampilkan.
      - DATA_UPDATED_AT=${DATA_UPDATED_AT}
      # Daftar akun login dashboard ("user:pass" dipisah koma). Wajib —
      # container menolak start tanpa satu pun akun, supaya tidak ada
      # deploy yang diam-diam terbuka. AUTH_USERNAME/AUTH_PASSWORD masih
      # diteruskan sebagai bentuk lama untuk satu akun.
      - AUTH_USERS=${AUTH_USERS}
      - AUTH_USERNAME=${AUTH_USERNAME}
      - AUTH_PASSWORD=${AUTH_PASSWORD}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
