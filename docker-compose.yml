services:
  app:
    build: .
    image: se2026-titik-maps:latest
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      - HOST=${HOST}
      - PORT=${PORT}
      - DATABASE=${DATABASE}
      - USERNAME=${USERNAME}
      - PASSWORD=${PASSWORD}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8082/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
